<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#764ba2">
<title>MTB 450</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh}
.h{background:#fff;margin:8px;border-radius:12px;padding:10px;text-align:center;font-weight:900;font-size:15px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.t{display:flex;gap:6px;padding:0 8px}.t button{flex:1;padding:10px 2px;border:0;border-radius:10px;font-weight:800;font-size:11px;background:#fff}.t button.a{background:#000;color:#fff}
.s{display:flex;gap:6px;padding:6px 8px}.s div{flex:1;background:#fff;border-radius:10px;padding:6px;text-align:center;font-weight:900;font-size:12px;line-height:1.1}
.s div small{font-size:9px;font-weight:700;color:#666}
.bar{height:6px;background:rgba(0,0,0,.2);margin:0 8px;border-radius:10px;overflow:hidden}.fill{height:100%;background:#2ecc71;transition:.3s}
.card{background:#fff;margin:8px;border-radius:16px;padding:14px;box-shadow:0 8px 25px rgba(0,0,0,.2)}
.qh{display:flex;justify-content:space-between;font-size:10px;font-weight:800;color:#764ba2;margin-bottom:6px}
.q{font-weight:800;font-size:15px;margin-bottom:12px;line-height:1.3}
.opt{width:100%;padding:12px;margin:5px 0;border:1.5px solid #eee;border-radius:10px;background:#f9f9f9;text-align:left;font-weight:700;display:flex;align-items:center;gap:10px;font-size:14px}
.opt b{width:26px;height:26px;background:#eee;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.opt.sel{border-color:#764ba2;background:#f3e8ff}.opt.correct{border-color:#2ecc71;background:#e8f8f0}.opt.wrong{border-color:#e74c3c;background:#fdecea}
.btns{display:flex;gap:8px;margin-top:12px}.btns button{flex:1;padding:11px;border:0;border-radius:10px;font-weight:800;font-size:12px}
#pop{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:10px 18px;border-radius:25px;font-weight:800;display:none;z-index:99}
</style>
</head>
<body>
<div class="h">MTB 450 • ANSWER SHOW • 150 EACH</div>
<div class="t"><button id="tM" onclick="setSub('M')" class="a">MATHS 150</button><button id="tP" onclick="setSub('P')">PHYSICS 150</button><button id="tB" onclick="setSub('B')">BIOLOGY 150</button></div>
<div class="s"><div id="sc">0<br><small>SCORE</small></div><div id="cr">0<br><small>CORRECT</small></div><div id="qn">1/50<br><small>Q</small></div><div id="ti">10<br><small>SEC</small></div></div>
<div class="bar"><div id="fill" class="fill" style="width:2%"></div></div>
<div class="card">
<div class="qh"><span id="qno">Q1</span><span id="meta">M - Set 1 - 1/150</span></div>
<div id="q" class="q">Loading questions...</div>
<div id="opts"></div>
<div class="btns"><button onclick="prevQ()" style="background:#f1f1f1">← Prev</button><button onclick="hint()" style="background:#ffcc00">💡 Hint (-5)</button><button onclick="skipQ()" style="background:#764ba2;color:#fff">Skip →</button></div>
</div>
<div id="pop"></div>
<script>
const baseM=[{q:"Which irrational number?",o:["1/2","0.25","√2","3"],a:2},{q:"Value of π approx?",o:["3.14","2.14","4.14","1.14"],a:0},{q:"(a+b)² = ?",o:["a²+b²","a²+2ab+b²","a²-2ab+b²","ab"],a:1}],baseP=[{q:"SI unit of distance?",o:["Kg","Metre","Second","Ampere"],a:1},{q:"Unit of Force?",o:["Newton","Joule","Watt","Pascal"],a:0},{q:"Speed of light?",o:["3x10⁸ m/s","3x10⁶ m/s","3x10⁵ m/s","3x10⁷ m/s"],a:0}],baseB=[{q:"Basic unit of life?",o:["Cell","Tissue","Organ","Atom"],a:0},{q:"Photosynthesis in?",o:["Leaf","Root","Stem","Flower"],a:0},{q:"Human heart chambers?",o:["2","3","4","1"],a:2}];
function gen150(b){let r=[];for(let i=0;i<150;i++){let x=b[i%b.length];r.push({q:x.q,o:x.o,a:x.a})}return r}
const DATA={M:gen150(baseM),P:gen150(baseP),B:gen150(baseB)};
let sub='M',set=0,cur=0,score=0,correct=0,Q=[],tmr,left=10,ans=[];
function setSub(s){sub=s;set=0;document.querySelectorAll('.t button').forEach(b=>b.classList.remove('a'));document.getElementById('t'+s).classList.add('a');load()}
function load(){Q=DATA[sub].slice(set*50,(set+1)*50);cur=0;ans=new Array(Q.length).fill(-1);render()}
function pop(t,c){let p=document.getElementById('pop');p.innerText=t;p.style.background=c||'#111';p.style.display='block';setTimeout(()=>p.style.display='none',1200)}
function startT(){clearInterval(tmr);left=10;document.getElementById('ti').innerHTML=left+"<br><small>SEC</small>";tmr=setInterval(()=>{left--;document.getElementById('ti').innerHTML=left+"<br><small>SEC</small>";if(left<=0){clearInterval(tmr);skipQ()}},1000)}
function render(){let q=Q[cur];document.getElementById('q').innerText=(cur+1)+". "+q.q;document.getElementById('qno').innerText="Q"+(cur+1);document.getElementById('meta').innerText=`${sub} - Set ${set+1} - ${set*50+cur+1}/150`;document.getElementById('qn').innerHTML=(cur+1)+"/50<br><small>Q</small>";document.getElementById('fill').style.width=((cur+1)/50*100)+"%";let box=document.getElementById('opts');box.innerHTML='';q.o.forEach((txt,i)=>{let b=document.createElement('button');b.className='opt';let isSel=ans[cur]==i;if(isSel){if(i==q.a)b.className+=' correct';else b.className+=' wrong'}b.innerHTML=`<b>${['A','B','C','D'][i]}</b> ${txt}`;b.onclick=()=>{ans[cur]=i;if(i==q.a){score+=2;correct++;pop('Correct! +2','#27ae60')}else{pop('Wrong! Ans: '+['A','B','C','D'][q.a]+'','#e74c3c')}document.getElementById('sc').innerHTML=score+"<br><small>SCORE</small>";document.getElementById('cr').innerHTML=correct+"<br><small>CORRECT</small>";setTimeout(()=>{if(cur<Q.length-1){cur++;render()}else{set=(set+1)%3;if(set==0){sub=sub=='M'?'P':sub=='P'?'B':'M';setSub(sub)}else load();pop('Set Complete!',' #764ba2')}},700);render()};box.appendChild(b)});startT()}
function prevQ(){if(cur>0){cur--;render()}}function skipQ(){if(cur<Q.length-1){cur++;render()}else{set=(set+1)%3;load()}}function hint(){if(score>=5){score-=5;document.getElementById('sc').innerHTML=score+"<br><small>SCORE</small>";let q=Q[cur];pop('Hint: '+['A','B','C','D'][q.a]+' is correct','#f39c12')}else pop('No points for hint!',' #000')}
load();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
