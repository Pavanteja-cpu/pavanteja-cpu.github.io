<head>

<title>MTB 450 ANSWER SHOW</title>
 html,body{margin:0;padding:0;height:auto;min-height:100vh}
body{display:block!important;padding:10px!important}<style>body{margin:0;font-family:system-ui;background:linear-gradient(135deg,#667eea,#764ba2,#f093fb);color:#fff;min-height:100vh}.h{position:sticky;top:0;background:rgba(0,0,0,.25);backdrop-filter:blur(12px);padding:12px;z-index:10}.tabs{display:flex;gap:6px;overflow:auto;margin-top:8px}.tab{padding:7px 15px;border-radius:20px;background:rgba(255,255,255,.25);font-weight:800;cursor:pointer;white-space:nowrap;font-size:12px}.tab.on{background:#fff;color:#764ba2}.stats{display:flex;gap:6px;margin-top:10px}.s{flex:1;background:#fff;color:#222;border-radius:14px;padding:7px;text-align:center}.s b{display:block;font-size:19px}.bar{height:12px;background:rgba(255,255,255,.3);border-radius:20px;margin-top:8px;overflow:hidden}#fill{height:100%;width:100%;background:linear-gradient(90deg,#00ff9d,#00f2fe);transition:width 10s linear}.card{margin:12px;background:#fff;color:#222;border-radius:20px;padding:16px}.opt{padding:13px;border:2.5px solid #eee;border-radius:14px;margin:8px 0;cursor:pointer;font-weight:700;display:flex;gap:10px;background:#fff}.opt.ok{border-color:#00b894;background:#d4ffe8}.opt.bad{border-color:#ff4757;background:#ffdde0}.opt.dim{opacity:.35;pointer-events:none}.badge{background:#764ba2;color:#fff;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:800}.hintBox{background:#ffeaa7;border:2px dashed #e17055;border-radius:12px;padding:10px;margin:10px 0;display:none;color:#6c3000;font-weight:700;font-size:13px}#pop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);padding:12px 24px;border-radius:20px;font-size:18px;font-weight:800;transition:.4s;z-index:99;color:#fff;text-align:center;max-width:80%}#pop.show{transform:translate(-50%,-50%) scale(1)}.btn{flex:1;padding:12px;border-radius:14px;border:none;font-weight:800;cursor:pointer}.btn.n{background:#764ba2;color:#fff}.btn.p{background:#fff;border:2px solid #ddd}.btn.hint{background:#fdcb6e;color:#6c3000}</style></head><body>
<div class="h"><div style="font-weight:900;font-size:18px">🎨 MTB 450 • ANSWER SHOW • 150 EACH</div><div style="font-size:11px">M 150 | P 150 | B 150 | +10 / +5 | Timer 0 = Answer Show + Auto Next</div><div class="tabs" id="tabs"></div><div class="stats"><div class="s"><b id="sc">0</b><span style="font-size:9px">SCORE</span></div><div class="s"><b id="co">0</b><span style="font-size:9px">CORRECT</span></div><div class="s"><b id="qt">1/50</b><span style="font-size:9px">Q</span></div><div class="s"><b id="tm">10.0</b><span style="font-size:9px">SEC</span></div></div><div class="bar"><div id="fill"></div></div></div>
<div style="max-width:720px;margin:auto"><div class="card" id="qc"><div style="display:flex;justify-content:space-between"><span class="badge" id="qn">Q1</span><span id="sn" style="font-size:11px;font-weight:800;color:#764ba2"></span></div><div id="qt2" style="font-weight:800;margin:12px 0;font-size:17px"></div><div class="hintBox" id="hintBox"></div><div id="opts"></div><div style="display:flex;gap:6px;margin-top:12px"><button class="btn p" id="prev">← Prev</button><button class="btn hint" id="hintBtn">💡 Hint (-5)</button><button class="btn n" id="next">Skip →</button></div></div><div class="card" id="res" style="display:none;text-align:center"><h2>🎉 Set Done!</h2><h1 id="fs" style="font-size:44px;color:#764ba2"></h1><p id="rs"></p><button class="btn n" style="width:100%" onclick="restart()">🔄 Restart</button><button class="btn p" style="width:100%;margin-top:8px" onclick="nextSet()">➡️ Next Set</button></div></div><div id="pop"></div>
<script>
const baseM=[{q:"Which irrational?",o:["1/2","0.25","√2","4"],a:2,h:"Non-perfect root irrational"},{q:"Rational decimal?",o:["Non-term","Terminating","Term or non-term recur","Non-recur"],a:2,h:"Rational terminates or repeats"},{q:"√144?",o:["10","11","12","14"],a:2,h:"12x12=144"},{q:"5^0?",o:["0","1","5","10"],a:1,h:"Power 0=1"},{q:"Degree 7x^4?",o:["2","3","4","7"],a:2,h:"Highest power degree"},{q:"Solve x+7=15",o:["7","8","9","22"],a:1,h:"15-7=8"},{q:"Triangle 35° 85° third?",o:["50","60","70","80"],a:1,h:"180-35-85=60"},{q:"Square side9 area?",o:["18","36","81","729"],a:2,h:"9²=81"},{q:"Circle r7 area?",o:["44","88","154","308"],a:2,h:"22/7*49=154"},{q:"Mean 5,10,15,20,25?",o:["10","15","20","25"],a:1,h:"75/5=15"}];
const baseP=[{q:"SI unit distance?",o:["Kg","Metre","Sec","Newton"],a:1,h:"Metres"},{q:"Scalar?",o:["Displacement","Velocity","Speed","Acceleration"],a:2,h:"Speed magnitude only"},{q:"Speed formula?",o:["T/D","D/T","D×T","D+T"],a:1,h:"D/T"},{q:"SI force?",o:["Joule","Watt","Newton","Pascal"],a:2,h:"Newton"},{q:"F=ma is?",o:["First","Second","Third","Grav"],a:1,h:"Second law"},{q:"Work SI?",o:["Newton","Joule","Watt","Pascal"],a:1,h:"Joule"},{q:"Power unit?",o:["Joule","Newton","Watt","Metre"],a:2,h:"Watt"},{q:"KE formula?",o:["mv","mgh","1/2 mv²","ma"],a:2,h:"½mv²"},{q:"Sound needs?",o:["Medium","Vacuum","Sunlight","Dark"],a:0,h:"Needs medium"},{q:"SI frequency?",o:["Metre","Hertz","Joule","Watt"],a:1,h:"Hertz"}];
const baseB=[{q:"Basic unit of life?",o:["Cell","Tissue","Organ","System"],a:0,h:"Cell basic"},{q:"Powerhouse?",o:["Nucleus","Mitochondria","Chloroplast","Ribosome"],a:1,h:"Mitochondria energy"},{q:"Cell wall in?",o:["Animal","Plant","Both","None"],a:1,h:"Plant has wall"},{q:"Blood is?",o:["Connective","Epithelial","Muscular","Nervous"],a:0,h:"Connective"},{q:"Malaria cause?",o:["Plasmodium","Bacteria","Virus","Fungus"],a:0,h:"Plasmodium"},{q:"Heart chambers?",o:["2","3","4","1"],a:2,h:"4 chambers"},{q:"Largest organ?",o:["Heart","Skin","Brain","Liver"],a:1,h:"Skin"},{q:"Bones adult?",o:["206","300","150","100"],a:0,h:"206"},{q:"Universal donor?",o:["O","AB","A","B"],a:0,h:"O gives all"},{q:"Normal BP?",o:["120/80","200/100","80/120","150/90"],a:0,h:"120/80"}];
function gen150(base){let arr=[];for(let i=0;i<150;i++){let b=base[i%base.length];arr.push({q:i<base.length?b.q:`${b.q} #${i+1}`,o:b.o,a:b.a,h:b.h});}return arr;}
const DATA={M:gen150(baseM),P:gen150(baseP),B:gen150(baseB)};
let sub='M',set=0,cur=0,score=0,correct=0,ans=[],Q=[],tmr=null,left=10,hintUsed=false;
function init(){const tb=document.getElementById('tabs');tb.innerHTML='';[['M','MATHS 150'],['P','PHYSICS 150'],['B','BIOLOGY 150']].forEach(([k,l])=>{const d=document.createElement('div');d.className='tab'+(k===sub?' on':'');d.textContent=l;d.onclick=()=>{sub=k;set=0;load();};tb.appendChild(d);});}
function load(){Q=DATA[sub].slice(set*50,(set+1)*50);cur=0;ans=Array(Q.length).fill(null);document.getElementById('res').style.display='none';document.getElementById('qc').style.display='block';render();}
function pop(txt,col){const p=document.getElementById('pop');p.textContent=txt;p.style.background=col||'#000';p.classList.add('show');setTimeout(()=>p.classList.remove('show'),2500);}
function startTimer(){clearInterval(tmr);left=10;const f=document.getElementById('fill');f.style.transition='none';f.style.width='100%';f.style.background='linear-gradient(90deg,#00ff9d,#00f2fe)';void f.offsetWidth;f.style.transition='width 10s linear';f.style.width='0%';document.getElementById('tm').textContent='10.0';tmr=setInterval(()=>{left-=0.1;document.getElementById('tm').textContent=left.toFixed(1);if(left<=3)f.style.background='#ff4757';if(left<=0){clearInterval(tmr);if(ans[cur]===null){const q=Q[cur];ans[cur]=-1;document.querySelectorAll('.opt').forEach((el,j)=>{if(j===q.a)el.classList.add('ok');});pop('⏰ Time! Answer: '+String.fromCharCode(65+q.a)+'. '+q.o[q.a]+'',' #ff4757');setTimeout(nextQ,2200);}else{nextQ();}}},100);}
function render(){const q=Q[cur];hintUsed=false;document.getElementById('qn').textContent='Q '+(set*50+cur+1);document.getElementById('sn').textContent=sub+' • Set '+(set+1)+' • '+(set*50+cur+1)+'/'+DATA[sub].length;document.getElementById('qt2').textContent=q.q;document.getElementById('hintBox').style.display='none';document.getElementById('opts').innerHTML='';q.o.forEach((o,i)=>{const d=document.createElement('div');d.className='opt';d.id='opt'+i;d.innerHTML='<div style="width:28px;height:28px;border-radius:50%;background:#764ba2;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800">'+String.fromCharCode(65+i)+'</div><div>'+o+'</div>';d.onclick=()=>{if(ans[cur]!==null&&ans[cur]!==-1)return;ans[cur]=i;clearInterval(tmr);if(i===q.a){if(hintUsed){score+=5;pop('+5 💡 Correct!','#fdcb6e');}else{score+=10;pop('+10 🎉 Correct!','#00b894');}correct++;}else{pop('❌ Wrong! Answer: '+String.fromCharCode(65+q.a)+'. '+q.o[q.a]+'','#ff4757');}q.o.forEach((_,j)=>{const el=document.getElementById('opt'+j);if(el){if(j===q.a)el.classList.add('ok');else if(j===i)el.classList.add('bad');}});update();setTimeout(nextQ,2200);};document.getElementById('opts').appendChild(d);});update();startTimer();}
function update(){document.getElementById('sc').textContent=score;document.getElementById('co').textContent=correct;document.getElementById('qt').textContent=(cur+1)+'/'+Q.length;}
function nextQ(){if(cur<Q.length-1){cur++;render();}else showRes();}
document.getElementById('prev').onclick=()=>{if(cur>0){clearInterval(tmr);cur--;render();}};document.getElementById('next').onclick=()=>{clearInterval(tmr);if(ans[cur]===null){const q=Q[cur];ans[cur]=-1;document.querySelectorAll('.opt').forEach((el,j)=>{if(j===q.a)el.classList.add('ok');});pop('Answer: '+String.fromCharCode(65+q.a)+'. '+q.o[q.a]+'','#636e72');setTimeout(nextQ,2000);}else{nextQ();}};
document.getElementById('hintBtn').onclick=()=>{if(ans[cur]!==null&&ans[cur]!==-1||hintUsed)return;hintUsed=true;const q=Q[cur];document.getElementById('hintBox').style.display='block';document.getElementById('hintBox').textContent='💡 Hint: '+q.h;pop('💡 Hint! +5 max','#fdcb6e');let r=0;q.o.forEach((_,i)=>{const d=document.getElementById('opt'+i);if(i!==q.a&&r<2){d.classList.add('dim');r++;}});};
function showRes(){clearInterval(tmr);document.getElementById('qc').style.display='none';document.getElementById('res').style.display='block';document.getElementById('fs').textContent=score+' pts';document.getElementById('rs').textContent='Correct '+correct+'/'+Q.length+' | Total '+DATA[sub].length+' | Set '+(set+1)+'/3';}
function restart(){load();}function nextSet(){if(set<2){set++;}else{set=0;sub=sub==='M'?'P':sub==='P'?'B':'M';}load();init();}init();load();
</script></body></html
