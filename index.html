<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#764ba2">
<title>MTB 450 - ANSWER SHOW</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:6px}
.h{background:#fff;padding:8px;border-radius:10px;text-align:center;font-weight:900;font-size:14px;margin-bottom:6px}
.tabs{display:flex;gap:4px;margin-bottom:6px} .tabs button{flex:1;padding:8px;font-size:11px;font-weight:800;background:#fff;border-radius:8px}
.tabs button.active{background:#000;color:#fff}
.info{display:flex;gap:4px;margin-bottom:6px} .info div{flex:1;background:#fff;padding:6px;border-radius:8px;text-align:center;font-size:11px;font-weight:800}
.card{background:#fff;border-radius:12px;padding:12px;max-width:600px;margin:auto}
.q{font-weight:800;margin-bottom:10px} .opt{width:100%;padding:10px;margin:4px 0;border:1px solid #ddd;border-radius:8px;background:#f9f9f9;text-align:left;font-weight:600}
.opt:active{background:#667eea;color:#fff}
.btns{display:flex;gap:6px;margin-top:10px} .btns button{flex:1;padding:10px;border:0;border-radius:8px;font-weight:800}
</style>
</head>
<body>
<div class="h">MTB 450 • ANSWER SHOW • 150 EACH<br><small>M 150 | P 150 | B 150 | 10 | 15 | Timer 0 - Answer Show + Auto Next</small></div>
<div class="tabs"><button id="tM" onclick="setSub('M')" class="active">MATHS 150</button><button id="tP" onclick="setSub('P')">PHYSICS 150</button><button id="tB" onclick="setSub('B')">BIOLOGY 150</button></div>
<div class="info"><div id="sc">0<br>SCORE</div><div id="cr">0<br>CORRECT</div><div id="qn">1/50<br>Q</div><div id="ti">10<br>SEC</div></div>
<div class="card">
<div id="meta" style="font-size:10px;font-weight:800;color:#764ba2;margin-bottom:4px">Q1 | M - Set 1 - 1/150</div>
<div id="q" class="q">Loading...</div>
<div id="opts"></div>
<div class="btns"><button onclick="prevQ()" style="background:#eee">← Prev</button><button onclick="useHint()" style="background:#ffcc00">💡 Hint (-5)</button><button onclick="skipQ()" style="background:#764ba2;color:#fff">Skip →</button></div>
</div>
<div id="pop" style="position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:8px 16px;border-radius:20px;display:none;font-weight:800"></div>
<script>
const baseM=[{q:"Which irrational?",o:["1/2","0.25","√2","4"],a:2},{q:"Value of π?",o:["3.14","2.14","4.14","1.14"],a:0}],baseP=[{q:"SI unit distance?",o:["Kg","Metre","Sec","Amp"],a:1},{q:"Force unit?",o:["Newton","Joule","Watt","Pascal"],a:0}],baseB=[{q:"Basic unit of life?",o:["Cell","Tissue","Organ","Atom"],a:0},{q:"Photosynthesis in?",o:["Leaf","Root","Stem","Flower"],a:0}];
function gen150(b){let a=[];for(let i=0;i<150;i++){let x=b[i%b.length];a.push({q:x.q,o:x.o,a:x.a})}return a}
const DATA={M:gen150(baseM),P:gen150(baseP),B:gen150(baseB)};
let sub='M',set=0,cur=0,score=0,correct=0,ans=[],Q=[],tmr,left=10;
function setSub(s){sub=s;set=0;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));document.getElementById('t'+s).classList.add('active');load()}
function load(){Q=DATA[sub].slice(set*50,(set+1)*50);cur=0;ans=new Array(Q.length).fill(-1);render()}
function pop(t,c){let p=document.getElementById('pop');p.innerText=t;p.style.background=c||'#000';p.style.display='block';setTimeout(()=>p.style.display='none',1200)}
function startTimer(){clearInterval(tmr);left=10;tmr=setInterval(()=>{left--;document.getElementById('ti').innerHTML=left+"<br>SEC";if(left<=0){clearInterval(tmr);skipQ()}},1000)}
function render(){let q=Q[cur];document.getElementById('q').innerText=(cur+1)+". "+q.q;document.getElementById('meta').innerText=`Q${cur+1} | ${sub} - Set ${set+1} - ${set*50+cur+1}/150`;document.getElementById('qn').innerHTML=(cur+1)+"/50<br>Q";let o=document.getElementById('opts');o.innerHTML='';q.o.forEach((t,i)=>{let b=document.createElement('button');b.className='opt';b.innerHTML=['A','B','C','D'][i]+"  "+t;if(ans[cur]==i)b.style.background='#667eea',b.style.color='#fff';b.onclick=()=>{ans[cur]=i;if(i==q.a){score+=2;correct++;pop('Correct! +2','#0a0')}else{pop('Wrong! Ans: '+['A','B','C','D'][q.a],'#f00')}document.getElementById('sc').innerHTML=score+"<br>SCORE";document.getElementById('cr').innerHTML=correct+"<br>CORRECT";setTimeout(()=>{if(cur<Q.length-1){cur++;render()}else{set=(set+1)%3;load();pop('Set Done! Next Set',' #764ba2')}},800)};o.appendChild(b)});startTimer()}
function prevQ(){if(cur>0){cur--;render()}}function skipQ(){cur<Q.length-1?cur++:set=(set+1)%3,load();render()}function useHint(){score=Math.max(0,score-5);document.getElementById('sc').innerHTML=score+"<br>SCORE";let q=Q[cur];pop('Hint: Option '+['A','B','C','D'][q.a],'#ff9800')}
load();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
