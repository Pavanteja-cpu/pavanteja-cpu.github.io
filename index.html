<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1-10 Class</title><style>body{background:#0a1931;color:#fff;font-family:Arial;padding:10px}.top{background:linear-gradient(90deg,#0052ff,#00d4ff);padding:14px;border-radius:12px;text-align:center;font-weight:bold}.card{background:#102a5a;padding:12px;border-radius:12px;margin:8px 0}.btn{padding:10px 14px;margin:5px;border:0;border-radius:8px;font-weight:bold}.cbtn{background:#fff}.cbtn.active{background:#00d4ff;color:#fff}.sbtn{background:#ffeb3b}.qbox{background:#0e2a60;padding:14px;border-radius:10px;margin:10px 0;color:#ffeb3b;border-left:4px solid #00d4ff}.opt{width:100%;padding:12px;margin:6px 0;border:0;border-radius:10px;font-weight:bold;background:#fff;text-align:left}#timer{background:#000;padding:10px;text-align:center;border-radius:10px;color:#ff9800;font-weight:bold;margin:10px 0}#hint{background:#332a00;color:#ffeb3b;padding:8px;border-radius:8px;display:none;text-align:center;border:1px dashed orange}.correct{background:#00c853!important;color:#fff!important}.wrong{background:#ff1744!important;color:#fff!important}</style></head><body>
<div class="top">📚 1st to 10th CLASS & SUBJECT WISE</div>
<div id="home"><div class="card"><b>CLASS:</b><div id="cls"></div></div><div class="card"><b>SUBJECT:</b><div id="sub"></div></div><div class="card" style="text-align:center"><button class="btn" style="background:#00d4ff;color:#fff;padding:12px 25px" onclick="startQuiz()">START QUIZ</button><div id="info" style="margin-top:10px;color:#ffeb3b"></div></div></div>
<div id="quiz" style="display:none"><div id="timer">15s</div><div id="q" class="qbox"></div><div id="hint"></div><button class="opt" id="o0" onclick="ans(0)"></button><button class="opt" id="o1" onclick="ans(1)"></button><button class="opt" id="o2" onclick="ans(2)"></button><button class="opt" id="o3" onclick="ans(3)"></button><div id="msg" style="text-align:center;font-weight:bold"></div><button class="btn" style="background:#fff;margin-top:15px" onclick="goHome()">BACK</button></div>
<script>
let selClass=5,selSub='Maths';const subjects=['Telugu','English','Maths','Science','Social','Physics','Biology','Chemistry','Computer','GK'];const db={'Telugu':[["Achulu?","16","36","46","12",0,"16"]],'English':[["A for?","Apple","Ball","Cat","Dog",0,"Apple"]],'Maths':[["2+2?","4","5","3","6",0,"4"], ["5x6?","30","25","35","40",0,"30"]],'Science':[["H2O?","Water","Salt","Sugar","Oil",0,"Water"]],'Social':[["Capital India?","Delhi","Mumbai","Hyd","Chennai",0,"Delhi"]],'Physics':[["Light speed?","3 lakh km/s","1 lakh","5 lakh","2 lakh",0,"Fast"]],'Biology':[["Heart?","4","2","3","1",0,"4"], ["Bones?","206","300","150","100",0,"206"]],'Chemistry':[["Gold?","Au","Ag","Fe","Cu",0,"Au"]],'Computer':[["CPU?","Central Processing Unit","Computer Unit","Central Power","None",0,"Brain"]],'GK':[["Largest planet?","Jupiter","Earth","Mars","Venus",0,"Jupiter"]]};
function renderClass(){let h='';for(let i=1;i<=10;i++){h+=`<button class="btn cbtn ${i==selClass?'active':''}" onclick="setClass(${i})">${i}th</button>`;}document.getElementById('cls').innerHTML=h;}
function renderSub(){let h='';subjects.forEach(s=>{h+=`<button class="btn sbtn ${s==selSub?'active':''}" onclick="setSub('${s}')">${s}</button>`;});document.getElementById('sub').innerHTML=h;}
function setClass(c){selClass=c;renderClass();updateInfo();}function setSub(s){selSub=s;renderSub();updateInfo();}
function updateInfo(){document.getElementById('info').innerText=`Selected: ${selClass}th - ${selSub} - 1200Q`;}
renderClass();renderSub();updateInfo();
let a=[],c=0,s=0,t=15,iv=null,ok=false;
function startQuiz(){let base=db[selSub];a=[];for(let r=0;r<150;r++){for(let q of base){let nq=[...q];nq[0]=`${selClass}th ${selSub}: ${q[0]} Q${a.length+1}`;a.push(nq);if(a.length>=1200)break;}if(a.length>=1200)break;}for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}document.getElementById('home').style.display='none';document.getElementById('quiz').style.display='block';c=0;s=0;sh();}
function goHome(){clearInterval(iv);document.getElementById('quiz').style.display='none';document.getElementById('home').style.display='block';}
function tm(){clearInterval(iv);t=15;ok=false;document.getElementById('hint').style.display='none';document.getElementById('timer').innerText='⏱️ '+t+'s';iv=setInterval(()=>{t--;document.getElementById('timer').innerText='⏱️ '+t+'s';if(t==7){document.getElementById('hint').innerText='💡 '+a[c][6];document.getElementById('hint').style.display='block';}if(t<=0&&!ok){clearInterval(iv);document.getElementById('o'+a[c][5]).classList.add('correct');setTimeout(()=>{c++;if(c<1200)sh();},1200);}},1000);}
function sh(){document.getElementById('q').innerText=(c+1)+'. '+a[c][0];for(let i=0;i<4;i++){let x=document.getElementById('o'+i);x.innerText=a[c][i+1];x.className='opt';}document.getElementById('msg').innerText=`Score:${s}/1200`;tm();}
function ans(i){if(ok)return;ok=true;clearInterval(iv);let cr=a[c][5];if(i==cr){s++;document.getElementById('o'+i).classList.add('correct');}else{document.getElementById('o'+i).classList.add('wrong');document.getElementById('o'+cr).classList.add('correct');}setTimeout(()=>{c++;if(c<1200)sh();else document.getElementById('msg').innerText=`Done Final:${s}/1200`;},800);}
</script></body></html>
