<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>No Repeat Demo</title><style>body{background:#0a1931;color:#fff;font-family:Arial;padding:10px}.top{background:linear-gradient(90deg,#0052ff,#00d4ff);padding:14px;border-radius:12px;text-align:center;font-weight:bold}.qbox{background:#102a5a;padding:14px;border-radius:10px;margin:10px 0;color:#ffeb3b;font-size:17px}.opt{width:100%;padding:12px;margin:6px 0;border:0;border-radius:10px;font-weight:bold;background:#fff;text-align:left}#timer{background:#000;padding:10px;text-align:center;border-radius:10px;color:#ff9800;font-weight:bold;margin:10px 0}.correct{background:#00c853!important;color:#fff!important}.wrong{background:#ff1744!important;color:#fff!important}</style></head><body><div class="top">DEMO - 120 UNIQUE MATHS - NO REPEAT</div><div id="timer"></div><div id="q" class="qbox"></div><button class="opt" id="o0" onclick="ans(0)"></button><button class="opt" id="o1" onclick="ans(1)"></button><button class="opt" id="o2" onclick="ans(2)"></button><button class="opt" id="o3" onclick="ans(3)"></button><div id="msg" style="text-align:center;font-weight:bold;margin-top:10px"></div><script>
function gen(){let a=[];for(let i=0;i<120;i++){let x=Math.floor(Math.random()*90)+10,y=Math.floor(Math.random()*90)+10,ans=x+y,opts=[ans,ans+1,ans+2,ans-1].sort(()=>0.5-Math.random()),cr=opts.indexOf(ans);a.push([`${x} + ${y} =?`,...opts.map(String),cr,`Add ${x}+${y}`]);}return a;}let a=gen(),c=0,s=0;function sh(){let q=a[c];document.getElementById('q').innerText=(c+1)+'. '+q[0];for(let i=0;i<4;i++){let b=document.getElementById('o'+i);b.innerText=q[i+1];b.className='opt';}document.getElementById('msg').innerText=`Score ${s}/120`;document.getElementById('timer').innerText=`Q ${c+1}/120 - No Repeat Demo`;}function ans(i){let cr=a[c][6];if(i==cr){s++;document.getElementById('o'+i).classList.add('correct');}else{document.getElementById('o'+i).classList.add('wrong');document.getElementById('o'+cr).classList.add('correct');}setTimeout(()=>{c++;if(c<120)sh();else document.getElementById('msg').innerText=`Done ${s}/120 - All 120 different!`;},600);}sh();
</script></body></html>
