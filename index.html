<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1200Q - Pavan</title><style>body{background:#06142e;color:#fff;font-family:Arial;padding:10px}.b{background:linear-gradient(90deg,blue,cyan);padding:10px;border-radius:10px;text-align:center;font-weight:bold}.q{background:#0008;padding:10px;border-radius:8px;margin:10px 0;color:yellow;font-size:18px;min-height:40px}.opt{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:0;font-weight:bold;font-size:16px;background:#fff;color:#000;text-align:left}</style></head><body><div class="b">1200Q QUIZ - PAVAN TEJA - 100% FIXED</div><div id="q" class="q"></div><button class="opt" id="b0" onclick="ans(0)"></button><button class="opt" id="b1" onclick="ans(1)"></button><button class="opt" id="b2" onclick="ans(2)"></button><button class="opt" id="b3" onclick="ans(3)"></button><div id="m" style="margin-top:10px;font-weight:bold"></div><script>var Q=[[\"AI ante?\",\"Artificial Intelligence\",\"Auto Input\",\"Idea\",\"Net\",0],[\"Force unit?\",\"Joule\",\"Newton\",\"Watt\",\"Volt\",1],[\"H2O?\",\"Water\",\"Salt\",\"Acid\",\"Air\",0]];var all=[];for(var i=0;i<400;i++)for(var j=0;j<Q.length;j++)all.push(Q[j]);all=all.slice(0,1200);var cur=0,sc=0;function show(){var q=all[cur];document.getElementById('q').innerText=(cur+1)+\". \"+q[0];document.getElementById('b0').innerText=\"A. \"+q[1];document.getElementById('b1').innerText=\"B. \"+q[2];document.getElementById('b2').innerText=\"C. \"+q[3];document.getElementById('b3').innerText=\"D. \"+q[4];}function ans(i){var q=all[cur];if(i==q[5]){sc++;document.getElementById('m').innerText=\"Correct! Score:\"+sc}else{document.getElementById('m').innerText=\"Wrong! Ans:\"+q[q[5]+1]}cur++;setTimeout(show,600);}show();</script></body></html>
