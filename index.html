<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#764ba2">
<title>MTB 450 - ANSWER SHOW</title>
<style>
*{box-sizing:border-box} 
body{margin:0;font-family:system-ui;background:linear-gradient(135deg,#667eea,#764ba2,#8e44ad);min-height:100vh;padding:0;display:flex;justify-content:center}
.wrap{width:100%;max-width:850px;min-height:100vh}
.header{background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);padding:14px;text-align:center;color:#fff;font-weight:900;font-size:15px}
.sub{font-size:11px;opacity:0.9;margin-top:2px}
.tabs{display:flex;gap:6px;padding:8px} 
.tabs button{flex:1;padding:12px 4px;border:0;border-radius:10px;font-size:12px;font-weight:800;background:#fff;cursor:pointer}
.tabs button.active{background:#000;color:#fff;transform:scale(1.02)}
.stats{display:flex;gap:6px;padding:0 8px 8px} 
.stats div{flex:1;background:#fff;border-radius:10px;padding:10px;text-align:center;font-weight:800;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.stats small{font-size:10px;color:#666}
.bar{height:8px;background:rgba(0,0,0,0.2);margin:0 8px;border-radius:10px;overflow:hidden} 
.fill{height:100%;width:35%;background:#2ecc71;transition:0.3s}
.card{background:#fff;margin:12px 8px;border-radius:20px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,0.25)}
.qno{font-size:11px;font-weight:800;color:#764ba2} 
.q{font-weight:800;margin:10px 0 16px;font-size:18px;line-height:1.4}
.opt{width:100%;padding:16px;margin:7px 0;border:2px solid #eee;border-radius:12px;background:#f9f9f9;text-align:left;font-weight:700;font-size:15px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:0.2s}
.opt:hover{border-color:#764ba2;background:#f3e8ff;transform:translateX(3px)}
.opt b{background:#eee;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.btns{display:flex;gap:10px;margin-top:18px} 
.btns button{flex:1;padding:14px;border:0;border-radius:12px;font-weight:800;font-size:13px;cursor:pointer}
.opt.correct{background:#d4edda!important;border-color:#28a745!important}
.opt.wrong{background:#f8d7da!important;border-color:#dc3545!important}

/* LARGE SCREEN - Desktop / Tablet */
@media(min-width:768px){
  .header{font-size:20px;padding:18px;border-radius:0 0 16px 16px;margin:0 8px}
  .sub{font-size:13px}
  .tabs button{padding:16px;font-size:14px}
  .stats div{padding:14px;font-size:18px}
  .card{padding:28px;margin:16px 8px}
  .q{font-size:22px}
  .opt{padding:18px;font-size:16px}
  .btns button{padding:16px;font-size:14px}
  body{padding:10px}
}
#pop{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:12px 22px;border-radius:30px;font-weight:800;display:none;z-index:99;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
<div class="header">MTB 450 • ANSWER SHOW • 150 EACH<div class="sub">M 150 | P 150 | B 150 | Timer 10s | Answer Show + Auto Next</div></div>
<div class="tabs"><button class="active" onclick="ch('M')">MATHS 150</button><button onclick="ch('P')">PHYSICS 150</button><button onclick="ch('B')">BIOLOGY 150</button></div>
<div class="stats"><div id="sc">0<br><small>SCORE</small></div><div id="cr">0<br><small>CORRECT</small></div><div id="qn">1/50<br><small>Q</small></div><div id="ti">10<br><small>SEC</small></div></div>
<div class="bar"><div id="fill" class="fill"></div></div>
<div class="card">
<div style="display:flex;justify-content:space-between"><span class="qno" id="qno">Q1</span><span class="qno" id="meta">M - Set 1 - 1/150</span></div>
<div class="q" id="q">Loading 450 unique questions...</div>
<div id="opts"></div>
<div class="btns"><button onclick="prev()" style="background:#f1f1f1">← Prev</button><button onclick="hint()" style="background:#ffcc00">💡 Hint (-5)</button><button onclick="next()" style="background:#764ba2;color:#fff">Skip →</button></div>
</div>
</div>
<div id="pop"></div>
<script>

const M=[],P=[],B=[];
for(let i=1;i<=150;i++){

  B.push({q:`Q${i}: Which is ${['Mammal','Cell organ','Vitamin','Blood group'][i%4]}?`,o:[['Whale','Mitochondria','Vitamin D','O+ve'][i%4],'Virus','Stone
