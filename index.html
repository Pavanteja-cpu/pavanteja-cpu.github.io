<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#764ba2">
<title>MTB 450 ANSWER SHOW</title>
<style>
html,body{margin:0;padding:0;height:auto}
body{font-family:system-ui;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:8px}
.h{background:#fff;padding:12px;border-radius:12px;text-align:center;font-weight:900;margin-bottom:8px}
.card{background:#fff;border-radius:12px;padding:12px;max-width:500px;margin:auto}
button{width:100%;padding:10px;margin:4px 0;border:0;border-radius:8px;font-weight:700;background:#eee}
</style>
</head>
<body>
<div class="h">MTB 450 • ANSWER SHOW • 150 EACH</div>
<div style="max-width:720px;margin:auto"><div class="card">
<div style="display:flex;justify-content:space-between;font-weight:800"><span id="sc">Score:0</span><span id="ti">10s</span></div>
<div id="q" style="font-weight:800;margin:10px 0"></div>
<div id="opts"></div>
<div style="display:flex;gap:6px"><button id="prev">Prev</button><button id="next">Next</button></div>
</div></div>
<div id="pop" style="position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:8px 16px;border-radius:20px;display:none"></div>
<script>
const baseM=[{q:"Which irrational?",o:["1/2","0.25","√2","3"],a:2}],baseP=[{q:"SI unit distance?",o:["Kg","Metre","Sec","Amp"],a:1}],baseB=[{q:"Basic unit of life?",o:["Cell","Tissue","Organ","Atom"],a:0}];
function gen150(b){let a=[];for(let i=0;i<150;i++)a.push({q:(i+1)+". "+b[i%b.length].q,o:b[i%b.length].o,a:b[i%b.length].a});return a}
const DATA={M:gen150(baseM),P:gen150(baseP),B:gen150(baseB)};
let sub='M',set=0,cur=0,score=0,Q=[],tmr,left=10,ans=[];
function load(){Q=DATA[sub].slice(set*50,(set+1)*50);cur=0;ans=new Array(Q.length).fill(-1);render()}
function pop(t,c){const p=document.getElementById('pop');p.innerText=t;p.style.background=c||'#000';p.style.display='block';setTimeout(()=>p.style.display='none',1200)}
function startTimer(){clearInterval(tmr);left=10;tmr=setInterval(()=>{left--;document.getElementById('ti').innerText=left+'s';if(left<=0){clearInterval(tmr);nextQ()}},1000)}
function render(){const q=Q[cur];document.getElementById('q').innerText=q.q;const o=document.getElementById('opts');o.innerHTML='';q.o.forEach((t,i)=>{const b=document.createElement('button');b.innerText=t;b.onclick=()=>{ans[cur]=i;if(i==q.a){score+=2;pop('Correct!','#0a0')}else pop('Wrong!','#f00');document.getElementById('sc').innerText='Score:'+score;nextQ()};o.appendChild(b)});startTimer()}
function nextQ(){if(cur<Q.length-1){cur++;render()}else{pop('Done! Score:'+score,'#764ba2')}}
document.getElementById('prev').onclick=()=>{if(cur>0){cur--;render()}};document.getElementById('next').onclick=()=>nextQ();
load();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
