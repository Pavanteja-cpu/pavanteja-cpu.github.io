<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

<div class="h">

<script>

tum"],a:1},{q:"Inertia?",o:["Resist change motion","Light","Pull Earth","Rate vel"],a:0},{q:"Inertia depends?",o:["Colour","Shape","Mass","Temp"],a:2},{q:"F=ma is?",o:["First","Second","Third","Grav"],a:1},{q:"Momentum?",o:["Mass×Vel","Mass/Vel","Force×Dist","Mass×Acc"],a:0},{q:"SI momentum?",o:["kg m/s","kg/m","m/s²","N/m"],a:0},{q:"Mass doubles momentum?",o:["Half","Doubles","Zero","Same"],a:1},{q:"Action reaction?",o:["First","Second","Third","Conserv"],a:2},{q:"Bus stops forward?",o:["Inertia motion","Magnet","Gravity","Air"],a:0},{q:"Gun recoil?",o:["First","Third","Reflect","Grav"],a:1},{q:"10N on 2kg a?",o:["2","5","10","20"],a:1},{q:"SI mass?",o:["Newton","Kg","Joule","Watt"],a:1},{q:"Weight?",o:["Kg","Metre","Newton","Sec"],a:2},{q:"W=mg?",o:["W=m/g","W=mg","W=m+g","W=m-g"],a:1},{q:"g value?",o:["4.9","8.9","9.8","98"],a:2},{q:"Weight Moon?",o:["1/6","Double","Same","6x"],a:0},{q:"Pressure?",o:["Force×Area","Force/Area","Area/Force","Mass×Vel"],a:1},{q:"SI pressure?",o:["Newton","Joule","Pascal","Watt"],a:2},{q:"Work SI?",o:["Newton","Joule","Watt","Pascal"],a:1},{q:"Work= ?",o:["Force×Displ","Mass×Vel","Force/Time","Mass×Acc"],a:0},{q:"10N 5m work?",o:["2J","15J","50J","5J"],a:2},{q:"No move work?",o:["10J","Zero","Neg","Infinite"],a:1},{q:"Power unit?",o:["Joule","Newton","Watt","Metre"],a:2},{q:"100J 10s power?",o:["10W","100W","1000W","0.1W"],a:0},{q:"KE formula?",o:["mv","mgh","1/2 mv²","ma"],a:2},{q:"Speed doubles KE?",o:["2x","3x","4x","Half"],a:2},{q:"PE mgh?",o:["mgh","mv","ma","F/t"],a:0},{q:"Sound produced by?",o:["Vibrating","Stationary","Light","Shadows"],a:0},{q:"Sound needs?",o:["Medium","Vacuum","Sunlight","Dark"],a:0},{q:"Cannot travel?",o:["Air","Water","Steel","Vacuum"],a:3},{q:"Sound in air?",o:["Transverse","Longitudinal","Light","Radio"],a:1},{q:"SI frequency?",o:["Metre","Hertz","Joule","Watt"],a:1},{q:"Audible?",o:["2-200","20-20k","200-200k","Above 200k"],a:1}],B:[{q:"Basic unit of life?",o:["Cell","Tissue","Organ","System"],a:0},{q:"Cell discovered 1665?",o:["Hooke","Darwin","Mendel","Newton"],a:0},{q:"Powerhouse?",o:["Nucleus","Mitochondria","Chloroplast","Ribosome"],a:1},{q:"Photosynthesis in?",o:["Mito","Chloroplast","Nucleus","Ribosome"],a:1},{q:"Cell wall in?",o:["Animal only","Plant","Both","None"],a:1},{q:"Largest organelle?",o:["Mito","Nucleus","Ribosome","Chloro"],a:1},{q:"Ribosome function?",o:["Protein","Photo","Resp","Storage"],a:0},{q:"DNA in?",o:["Nucleus only","Mito+Nucleus","Ribosome","Wall"],a:1},{q:"Prokaryotic?",o:["Bacteria","Human","Plant","Animal"],a:0},{q:"Membrane is?",o:["Permeable","Semi-perm","Imperm","None"],a:1},{q:"Tissue?",o:["Group similar cells","Single cell","Organ","System"],a:0},{q:"Meristematic in?",o:["Animals","Plants growing","Brain","Heart"],a:1},{q:"Xylem transports?",o:["Food","Water","Both","None"],a:1},{q:"Phloem transports?",o:["Water","Food","Air","Blood"],a:1},{q:"Blood is?",o:["Connective","Epithelial","Muscular","Nervous"],a:0},{q:"Neuron unit?",o:["Muscular","Nervous","Digestive","Resp"],a:1},{q:"Cardiac muscle?",o:["Voluntary","Involuntary striated","Non-stri","None"],a:1},{q:"Epithelial covers?",o:["Body surfaces","Bones","Blood","None"],a:0},{q:"Malaria cause?",o:["Plasmodium","Bacteria","Virus","Fungus"],a:0},{q:"TB cause?",o:["Mycobacterium","Virus","Fungus","Protozoa"],a:0},{q:"AIDS cause?",o:["HIV","Bacteria","Fungus","Protozoa"],a:0},{q:"Viral disease?",o:["Common cold","TB","Cholera","Typhoid"],a:0},{q:"Cholera cause?",o:["Vibrio","Virus","Fungus","Worm"],a:0},{q:"Vit C deficiency?",o:["Scurvy","Rickets","Night blind","Beriberi"],a:0},{q:"Vit D deficiency?",o:["Rickets","Scurvy","Beriberi","Anemia"],a:0},{q:"Iron deficiency?",o:["Anemia","Scurvy","Rickets","Goitre"],a:0},{q:"Goitre due to?",o:["Iodine","Iron","Calcium","Vit C"],a:0},{q:"Largest gland?",o:["Liver","Pancreas","Thyroid","Adrenal"],a:0},{q:"Insulin from?",o:["Pancreas","Liver","Kidney","Heart"],a:0},{q:"Respiration in?",o:["Mito","Chloro","Nucleus","Wall"],a:0},{q:"ATP?",o:["Adenosine Triphosphate","Adenine","Both","None"],a:0},{q:"Chromosome human?",o:["46","23","44","48"],a:0},{q:"DNA full form?",o:["Deoxyribonucleic acid","Diri","Both","None"],a:0},{q:"Mitosis?",o:["2 identical","4 cells","1 cell","3 cells"],a:0},{q:"Heart chambers?",o:["2","3","4","1"],a:2},{q:"Kidney function?",o:["Filtration","Digestion","Resp","Circulation"],a:0},{q:"Largest organ?",o:["Heart","Skin","Brain","Liver"],a:1},{q:"Bones adult?",o:["206","300","150","100"],a:0},{q:"Universal donor?",o:["O","AB","A","B"],a:0},{q:"Universal recipient?",o:["O","AB","A","B"],a:1},{q:"Vector malaria?",o:["Female Anopheles","Male","Housefly","Cockroach"],a:0},{q:"Decomposer?",o:["Bacteria fungi","Lion","Cow","Goat"],a:0},{q:"Ozone protects from?",o:["UV","Visible","IR","Radio"],a:0},{q:"Greenhouse gas?",o:["CO2","O2","N2","H2"],a:0},{q:"Biodegradable?",o:["Paper","Plastic","Glass","Metal"],a:0},{q:"Blood slightly?",o:["Alkaline","Acidic","Neutral","None"],a:0},{q:"RBC life?",o:["120 days","10 days","1 year","1 day"],a:0},{q:"Hemoglobin in?",o:["RBC","WBC","Platelet","Plasma"],a:0},{q:"Normal BP?",o:["120/80","200/100","80/120","150/90"],a:0},{q:"ECG for?",o:["Heart","Brain","Kidney","Liver"],a:0}]};
let sub='M', set=0, cur=0, score=0, correct=0, ans=[], Q=[], tmr=null, left=10;
function init(){
 const tb=document.getElementById('tabs'); tb.innerHTML='';
 ['M','P','B'].forEach(k=>{
  const d=document.createElement('div'); d.className='tab'+(k===sub?' on':'');
  d.textContent=(k==='M'?'🔢 MATHS':k==='P'?'⚙️ PHYSICS':'🧬 BIOLOGY');
  d.onclick=()=>{sub=k; set=0; load();};
  tb.appendChild(d);
 });
}
function load(){
 Q=DATA[sub].slice(set*50,(set+1)*50);
 if(Q.length===0){Q=DATA[sub];}
 cur=0; ans=Array(Q.length).fill(null);
 document.getElementById('res').style.display='none';
 document.getElementById('qc').style.display='block';
 render();
}
function bubble(txt,col){
 const p=document.getElementById('pop'); p.textContent=txt; p.style.background=col||'#000'; p.classList.add('show');
 setTimeout(()=>p.classList.remove('show'),700);
}
function startTimer(){
 clearInterval(tmr); left=10;
 const fill=document.getElementById('fill');
 fill.style.transition='none'; fill.style.width='100%'; fill.style.background='#00ff9d';
 void fill.offsetWidth;
 fill.style.transition='width 10s linear'; fill.style.width='0%';
 document.getElementById('tm').textContent='10.0';
 tmr=setInterval(()=>{
  left-=0.1;
  document.getElementById('tm').textContent=left.toFixed(1);
  if(left<=3) fill.style.background='#ff4757';
  else if(left<=6) fill.style.background='#ffa502';
  if(left<=0){clearInterval(tmr); if(ans[cur]===null){score-=10; bubble('-10 ⏰','#ff4757');} nextQ();}
 },100);
}
function render(){
 const q=Q[cur];
 document.getElementById('qn').textContent='Q '+(set*50+cur+1);
 document.getElementById('sn').textContent=sub+' Set '+(set+1);
 document.getElementById('qt2').textContent=q.q;
 document.getElementById('opts').innerHTML='';
 q.o.forEach((o,i)=>{
  const d=document.createElement('div'); d.className='opt';
  if(ans[cur]!==null){ if(i===q.a) d.classList.add('ok'); else if(i===ans[cur]) d.classList.add('bad'); }
  d.innerHTML='<div style="width:28px;height:28px;border-radius:50%;background:#764ba2;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800">'+String.fromCharCode(65+i)+'</div><div>'+o+'</div>';
  d.onclick=()=>{
   if(ans[cur]!==null) return;
   ans[cur]=i; clearInterval(tmr);
   if(i===q.a){score+=5; correct++; bubble('+5 🎉','#00b894');} else {score-=10; bubble('-10 😢','#ff4757');}
   update(); render();
   setTimeout(nextQ,700);
  };
  document.getElementById('opts').appendChild(d);
 });
 update(); startTimer();
}
function update(){
 document.getElementById('sc').textContent=score;
 document.getElementById('co').textContent=correct;
 document.getElementById('qt').textContent=(cur+1)+'/'+Q.length;
}
function nextQ(){
 if(cur<Q.length-1){cur++; render();} else {showRes();}
}
document.getElementById('prev').onclick=()=>{if(cur>0){clearInterval(tmr); cur--; render();}};
document.getElementById('next').onclick=()=>{clearInterval(tmr); if(ans[cur]===null){score-=10; bubble('-10 ⏭️','#ff4757');} nextQ();};
function showRes(){
 clearInterval(tmr);
 document.getElementById('qc').style.display='none';
 document.getElementById('res').style.display='block';
 document.getElementById('fs').textContent=score+' pts';
 document.getElementById('rs').textContent='Correct '+correct+'/'+Q.length+' | +5 correct / -10 wrong/timeout';
}
function restart(){load();}
function nextSet(){ if(set<2){set++; load();} else {set=0; sub=sub==='M'?'P':sub==='P'?'B':'M'; load();} init(); }
init(); load();
</script></body></html>
