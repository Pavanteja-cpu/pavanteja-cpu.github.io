<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1200Q Timer Hint</title><style>body{background:#0a1931;color:#fff;font-family:Arial;padding:10px}.top{background:linear-gradient(90deg,#0052ff,#00d4ff);padding:12px;border-radius:10px;text-align:center;font-weight:bold}.qbox{background:#102a5a;padding:15px;border-radius:10px;margin:12px 0;color:#ffeb3b;border-left:4px solid #00d4ff;font-size:18px}.opt{width:100%;padding:12px;margin:6px 0;border:0;border-radius:10px;font-weight:bold;text-align:left;background:#fff}#timer{background:#000;padding:10px;text-align:center;border-radius:10px;color:#ff9800;font-size:22px;font-weight:bold;margin:10px 0}#hint{background:#332a00;color:#ffeb3b;padding:10px;border-radius:8px;display:none;text-align:center;border:1px dashed orange;margin:8px 0}.correct{background:#00c853!important;color:#fff!important}.wrong{background:#ff1744!important;color:#fff!important}</style></head><body><div class="top">1200Q QUIZ - TIMER + HINT</div><div id="timer">⏱️ 15s</div><div id="q" class="qbox"></div><div id="hint"></div><button class="opt" id="o0" onclick="ans(0)"></button><button class="opt" id="o1" onclick="ans(1)"></button><button class="opt" id="o2" onclick="ans(2)"></button><button class="opt" id="o3" onclick="ans(3)"></button><div id="msg" style="text-align:center;font-weight:bold;margin-top:10px"></div><script>var b=[["AI ante enti?","Artificial Intelligence","Auto Input","All Idea","Net",0,"Computer ki alochana shakti"],["H2O ante?","Water","Salt","Sugar","Oil",0,"Manam thage neeru"],["India capital?","Delhi","Mumbai","Hyderabad","Chennai",0,"Red Fort akkada undi"],["Computer brain?","CPU","Mouse","Keyboard","Screen",0,"Central Processing Unit"]];var a=[];for(let i=0;i<300;i++)for(let j of b)a.push(j);a=a.slice(0,1200);var c=0,s=0,t=15,iv=null,ok=false;function tm(){clearInterval(iv);t=15;ok=false;document.getElementById('hint').style.display='none';document.getElementById('timer').innerText='⏱️ '+t+'s';iv=setInterval(()=>{t--;document.getElementById('timer').innerText='⏱️ '+t+'s';if(t==7){document.getElementById('hint').innerText='💡 Hint: '+a[c][6];document.getElementById('hint').style.display='block';}if(t<=0&&!ok){clearInterval(iv);document.getElementById('o'+a[c][5]).classList.add('correct');setTimeout(()=>{c++;if(c<1200)sh();},2000);}},1000);}function sh(){let q=a[c];document.getElementById('q').innerText=(c+1)+'. '+q[0];for(let i=0;i<4;i++){let x=document.getElementById('o'+i);x.innerText=q[i+1];x.className='opt';}document.getElementById('msg').innerText='Score: '+s;tm();}function ans(i){if(ok)return;ok=true;clearInterval(iv);let q=a[c],cr=q[5];if(i==cr){s++;document.getElementById('o'+i).classList.add('correct');}else{document.getElementById('o'+i).classList.add('wrong');document.getElementById('o'+cr).classList.add('correct');}setTimeout(()=>{c++;if(c<1200)sh();},1200);}sh();</script></body></html>
